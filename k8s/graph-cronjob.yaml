apiVersion: batch/v1
kind: CronJob
metadata:
  name: meat-thermometer-graph
  namespace: default
  labels:
    app: meat-thermometer-graph
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            app: meat-thermometer-graph
        spec:
          restartPolicy: Never
          nodeSelector:
            kubernetes.io/arch: amd64
          containers:
          - name: meat-thermometer-graph
            image: kregistry.siwko.org:5000/meat-thermometer-graph:latest
            imagePullPolicy: Always
            env:
            - name: PGHOST
              value: prod-postgres-rw.default.svc.cluster.local
            - name: PGPORT
              value: "5432"
            - name: PGDATABASE
              value: sdr433
            - name: PGUSER
              valueFrom:
                secretKeyRef:
                  name: sdr433-role-credentials
                  key: username
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: sdr433-role-credentials
                  key: password
            - name: MAVERICK_MODEL
              value: Maverick-ET73
            - name: ACURITE_MODEL
              value: Acurite-5n1
            - name: LOOKBACK_HOURS
              value: "8"
            - name: GRAPH_MIN_F
              value: "0"
            - name: GRAPH_MAX_F
              value: "250"
            - name: MAVERICK_OFFSET_F
              value: "-41"
            - name: MAVERICK_RECALIBRATED_AT
              value: "2026-07-25T16:14:38+00:00"
            - name: OUTDOOR_MIN_F
              value: "50"
            - name: OUTDOOR_MAX_F
              value: "100"
            - name: WIND_MIN_MPH
              value: "0"
            - name: WIND_MAX_MPH
              value: "10"
            - name: OUTPUT_PATH
              value: /output/maverick-temperature.png
            - name: SCP_HOST
              value: lts.siwko.org
            - name: SCP_PORT
              value: "8022"
            - name: SCP_USER
              value: root
            - name: SCP_PATH
              value: /var/www/html/maverick-temperature.png
            - name: SCP_KEY_PATH
              value: /secrets/ssh/id_ed25519
            - name: SCP_KNOWN_HOSTS_PATH
              value: /secrets/ssh/known_hosts
            volumeMounts:
            - name: graph-output
              mountPath: /output
            - name: ssh-key
              mountPath: /secrets/ssh/id_ed25519
              subPath: id_ed25519
              readOnly: true
            - name: ssh-known-hosts
              mountPath: /secrets/ssh/known_hosts
              subPath: known_hosts
              readOnly: true
          volumes:
          - name: graph-output
            persistentVolumeClaim:
              claimName: meat-thermometer-graph-pvc
          - name: ssh-key
            secret:
              secretName: meat-thermometer-graph-ssh-key
              defaultMode: 0400
          - name: ssh-known-hosts
            configMap:
              name: meat-thermometer-graph-known-hosts
